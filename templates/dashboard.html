<!doctype html><html><head><title>PII Security Dashboard</title></head><body><h1>Secure PII Dashboard</h1><p>Role: {{role}} | <a href="/logout">Logout</a></p><form method="post" action="/add"><textarea name="value" rows="4" cols="70" placeholder="Enter test PII"></textarea><br><button>Encrypt & Store</button></form><h2>Records</h2>{% for r in records %}<article><p><b>ID:</b> {{r.id}} | <b>Owner:</b> {{r.owner}}</p><p><b>PII:</b> {{r.pii_types or "none detected"}}</p><p><b>Display:</b> {{r.value}}</p><p><b>SHA-256:</b> {{r.digest}}</p></article>{% else %}<p>No records.</p>{% endfor %}</body></html>
